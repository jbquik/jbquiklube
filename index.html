*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,

article, aside, canvas, details, embed,
figure, figcaption, footer, header, hgroup,
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
  margin: 0;
  padding: 0;
  border: 0;
  font-size: 100%;
  font: inherit;
  vertical-align: baseline;
}

article, aside, details, figcaption, figure,
footer, header, hgroup, menu, nav, section {
  display: block;
}

ol, ul {
  list-style: none;
}

blockquote, q {
  quotes: none;
}

blockquote:before, blockquote:after,
q:before, q:after {
  content: '';
  content: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

img, picture, video, canvas, svg {
  display: block;
  max-width: 100%;
}

input, button, textarea, select {
  font: inherit;
}

p, h1, h2, h3, h4, h5, h6 {
  overflow-wrap: break-word;
}

a {
  text-decoration: none;
  color: inherit;
}

button {
  background: none;
  border: none;

}

<script>
(() => {
  const MAILTO =
    'mailto:jack@jbquiklube.com?subject=Service%20Request%20from%20Website&body=Name:%0APhone:%0AVehicle:%0ARequested%20Service:%0APreferred%20Date/Time:%0A';
  const EMAIL = 'jack@jbquiklube.com';

  function patchEmailButtons() {
    let changed = false;
    const targets = [/email us with your questions/i, /^contact us$/i];

    document.querySelectorAll('button, a').forEach(el => {
      const txt = (el.textContent || '').trim();
      if (!targets.some(rx => rx.test(txt))) return;

      if (el.tagName === 'A') {
        if (!el.href || !el.href.startsWith('mailto:')) el.href = MAILTO;
      } else {
        const a = document.createElement('a');
        a.href = MAILTO;
        a.className = el.className;
        a.innerHTML = el.innerHTML; // keep icon + text
        a.setAttribute('role','button');
        el.replaceWith(a);
      }
      changed = true;
    });
    return changed;
  }

  // Turn any footer/plain text "jack@jbquiklube.com" into a mailto link
  function patchFooterEmail() {
    const root = document.querySelector('footer') || document.body;
    if (!root) return false;

    // Find text nodes with the email that are not already inside a link
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const toPatch = [];
    while (walker.nextNode()) {
      const n = walker.currentNode;
      if (!n.nodeValue) continue;
      if (n.parentElement && n.parentElement.closest('a')) continue;
      if (n.nodeValue.includes(EMAIL)) toPatch.push(n);
    }

    toPatch.forEach(n => {
      const parts = n.nodeValue.split(EMAIL);
      const frag = document.createDocumentFragment();
      parts.forEach((p, i) => {
        if (p) frag.appendChild(document.createTextNode(p));
        if (i < parts.length - 1) {
          const a = document.createElement('a');
          a.href = MAILTO;
          a.textContent = EMAIL;
          a.rel = 'nofollow noopener';
          frag.appendChild(a);
        }
      });
      n.parentNode.replaceChild(frag, n);
    });

    // Also handle elements that are exactly the email (common in footers)
    root.querySelectorAll('*:not(a)').forEach(el => {
      const txt = (el.textContent || '').trim();
      if (txt === EMAIL) {
        const a = document.createElement('a');
        a.href = MAILTO;
        a.textContent = EMAIL;
        el.replaceChildren(a);
      }
    });

    return toPatch.length > 0;
  }

  // SPA safety: run after load and retry briefly for hydrated content
  function runPatches() {
    patchEmailButtons();
    patchFooterEmail();
  }

  window.addEventListener('load', () => {
    let tries = 0;
    const t = setInterval(() => {
      runPatches();
      if (++tries >= 20) clearInterval(t);
    }, 250);
  });
})();
</script>
